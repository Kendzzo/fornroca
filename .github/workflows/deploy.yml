name: Deploy to GitHub Pages

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build && cp dist/index.html dist/404.html
        env:
          VITE_SUPABASE_URL: https://c--b5743d71-2b86-4661-8d25-1d452f83a929-prod.lovable.cloud
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_X61eJbOHDJ10RDmuN1m0gw_9MURRYuB
          VITE_SUPABASE_PROJECT_ID: snsbhmhlznhkgabccjwo

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
